name: Build Release APK
on:
  push:
    branches:
      - "main"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK (GMS / full)
        run: ./gradlew --console=plain assembleGmsRelease --build-cache --warning-mode summary
        env:
          SUIKAAWAVE_APPLICATION_ID: com.suikaawave.music
          SUIKAAWAVE_APP_NAME: SuikaaWave
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      # Signing: pakai keystore dari secrets kalau ada, kalau tidak
      # generate keystore sementara supaya APK tetap bisa di-install.
      - name: Sign APK
        run: |
          set -e
          OUT=app/build/outputs/apk/gms/release
          APK=$(ls $OUT/*.apk | head -1)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "${{ secrets.KEYSTORE }}" | base64 -d > release.jks
            ALIAS="${{ secrets.KEY_ALIAS }}"
            SPASS="${{ secrets.KEYSTORE_PASSWORD }}"
            KPASS="${{ secrets.KEY_PASSWORD }}"
          else
            keytool -genkeypair -v -keystore release.jks -alias suikaawave \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass suikaawave -keypass suikaawave \
              -dname "CN=SuikaaWave,O=Suika,C=ID"
            ALIAS=suikaawave; SPASS=suikaawave; KPASS=suikaawave
          fi
          $BT/zipalign -p -f 4 "$APK" aligned.apk
          $BT/apksigner sign --ks release.jks --ks-key-alias "$ALIAS" \
            --ks-pass pass:"$SPASS" --key-pass pass:"$KPASS" \
            --out SuikaaWave.apk aligned.apk
          $BT/apksigner verify SuikaaWave.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: SuikaaWave
          path: SuikaaWave.apk
